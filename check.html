<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontrola karet</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; color: #222; background: #fafaf7; line-height: 1.45; }
    h1 { margin-bottom: 0; }
    h2 { margin-top: 2em; border-bottom: 2px solid #c9a24a; }
    h3 { color: #8a6a22; margin-bottom: 0.4em; }
    .errors li { color: #b3261e; }
    .warnings li { color: #8a5a00; }
    .ok { color: #2e7d32; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    .card { background: #fff; border: 1px solid #e3dccb; border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
    .meta { font-size: 0.8rem; color: #888; margin: 0; font-family: ui-monospace, monospace; }
    .character { font-weight: bold; margin: 0.4em 0 0; }
    .text { font-family: Georgia, serif; font-size: 1.05rem; }
    .choice { margin: 6px 0; }
    .choice .label { font-weight: 600; }
    .choice .effect { margin-left: 10px; font-size: 0.9rem; color: #555; white-space: nowrap; }
    .choice .flag { margin-left: 10px; font-size: 0.8rem; color: #6a1b9a; }
    .log { font-size: 0.9rem; color: #555; background: #f4ead5; padding: 6px 10px; border-radius: 6px; margin: 6px 0 0; }
  </style>
  <script type="module" src="js/check.js"></script>
</head>
<body>
  <h1>Kontrola karet</h1>
  <p id="summary">Načítám…</p>
  <h2>Chyby</h2>
  <div id="errors"></div>
  <h2>Upozornění</h2>
  <div id="warnings"></div>
  <h2>Simulace (2000 her na typ hráče)</h2>
  <p>„Zamýšlená volba“ = hráč, který volí přiměřeně (pole <code>intended</code>); měl by skoro vždy doplout. „Vyvažuje“ = hráč, který jen hlídá čísla. „Náhodně“ by měl padat často.</p>
  <div id="sim">Počítám…</div>
  <h2>Scénář</h2>
  <div id="script"></div>
</body>
</html>
